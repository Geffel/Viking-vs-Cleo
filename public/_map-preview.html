<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kartforhandsvy</title>
    <style>
      html, body { margin: 0; background: #000; }
      canvas { display: block; width: 1600px; height: 900px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      // Ritar en karta utan att en match behover startas.
      //   ?map=<id>    vilken karta (default ivory_city)
      //   &nazgul=1    tvingar fram overflygningen direkt
      import { Renderer } from '/js/render.js';
      import { mapConfigFor, mapLayoutFor, mapThemeFor } from '/shared/constants.js';

      const params = new URLSearchParams(location.search);
      const id = params.get('map') ?? 'ivory_city';
      const r = new Renderer(document.getElementById('c'));
      r.setArena(mapConfigFor(id).asset ?? '', mapThemeFor(id));
      r.setMapLayout(mapLayoutFor(id));

      if (params.has('nazgul')) r.city.nazgul.nextAt = 0;

      (function frame() {
        r.draw([], [], [], 0, 16);
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
